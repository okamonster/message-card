name: akari2026-web

on:
  push:
    branches: [main]
    paths:
      - "apps/akari2026-web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/akari2026-web.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/akari2026-web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/akari2026-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akari2026-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/akari2026-web

jobs:
  check:
    name: Lint / Type check / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter akari2026-web...

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter akari2026-web...

      - name: Build and deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
